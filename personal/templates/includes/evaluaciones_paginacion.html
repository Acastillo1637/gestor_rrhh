{% if pagina.has_other_pages %}
<nav class="employee-form-actions" aria-label="Páginas de evaluaciones">
    {% if pagina.has_previous %}<a class="btn btn-secondary" href="?{{ filtros }}&page={{ pagina.previous_page_number }}">Anterior</a>{% endif %}
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
    {% if pagina.has_next %}<a class="btn btn-secondary" href="?{{ filtros }}&page={{ pagina.next_page_number }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
