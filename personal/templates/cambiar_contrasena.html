{% extends "base_site.html" %}

{% block title %}
Cambiar contrase&ntilde;a | Gestor de Personal
{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Cambiar contrase&ntilde;a</h1>
    <p>Actualiza la contrase&ntilde;a de tu cuenta.</p>
</div>

<div class="card">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Cambiar contrase&ntilde;a
                </button>

                <a href="{% url 'inicio' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
